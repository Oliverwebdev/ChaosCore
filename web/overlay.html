<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title data-i18n="overlay.pageTitle">ChaosCore Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: #B026FF; --ink: #f4eaff; --dim: #a98fcb; --panel: rgba(10, 6, 18, .82); --line: rgba(176, 38, 255, .55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--ink);
    font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif; }
  body.preview { background: #0b0714 linear-gradient(135deg, #0b0714, #1a0b2e); }
  .mono { font-family: "Cascadia Mono", Consolas, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
  .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 22px -6px var(--accent), inset 0 0 0 1px rgba(255,255,255,.03);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .label { font-size: 12px; color: var(--dim); }
  /* Eigener Stil je Fenster (Dashboard → Overlay → Aussehen der Fenster) */
  .panel.styled { --p-rgb: 10, 6, 18; background: rgba(var(--p-rgb), var(--p-a, .82)); color: var(--ink); }
  .panel.st-dark { --p-rgb: 16, 18, 24; --line: rgba(255,255,255,.16); --ink: #f2f4f8; --dim: #9aa3b2; }
  .panel.st-light { --p-rgb: 255, 255, 255; --line: rgba(20,24,36,.16); --ink: #151923; --dim: #5b6575; }
  .panel.st-glass { --p-rgb: 22, 20, 34; --line: rgba(255,255,255,.22); --ink: #ffffff; --dim: #c9c3dd; backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); }
  .panel.st-round { clip-path: none; border-radius: var(--p-r, 12px); }
  .panel.st-noborder { border-color: transparent !important; }
  .panel.st-noglow { box-shadow: none !important; }

  /* ---- Alert ---- */
  #alert { position: absolute; top: 48px; left: 50%; transform: translate(-50%, -160%); width: min(760px, 90vw); padding: 18px 28px 20px;
    border-color: var(--c, var(--accent)); box-shadow: 0 0 40px -4px var(--c, var(--accent)); transition: transform .45s cubic-bezier(.2,.9,.2,1); text-align: center; }
  #alert.show { transform: translate(-50%, 0); }
  /* versteckt wirklich unsichtbar - sonst blitzt bei leerem Alert ein Rand oben am Bildrand hervor */
  #alert:not(.show) { opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.2,1), opacity .2s .25s; }
  #alert .who { font-size: 14px; color: var(--c, var(--accent)); }
  #alert .what { font-size: 46px; font-weight: 800; line-height: 1.05; margin: 6px 0 4px; text-transform: uppercase; position: relative; }
  #alert .what::before, #alert .what::after { content: attr(data-t); position: absolute; left: 0; right: 0; opacity: 0; }
  #alert.show .what::before { color: #00f0ff; animation: glitch1 .9s steps(2) 1; }
  #alert.show .what::after { color: #ff2bd6; animation: glitch2 .9s steps(2) 1; }
  #alert .flav { font-size: 18px; color: var(--dim); font-style: italic; }
  @keyframes glitch1 { 0%,100% { opacity: 0 } 20% { opacity: .8; transform: translate(-4px, 1px); clip-path: inset(10% 0 55% 0) } 60% { opacity: .8; transform: translate(3px, -1px); clip-path: inset(60% 0 8% 0) } }
  @keyframes glitch2 { 0%,100% { opacity: 0 } 30% { opacity: .8; transform: translate(4px, -1px); clip-path: inset(45% 0 20% 0) } 70% { opacity: .8; transform: translate(-3px, 1px); clip-path: inset(5% 0 70% 0) } }

  /* ---- Aktiver Effekt ---- */
  #effect { position: absolute; left: 36px; bottom: 36px; width: 420px; padding: 14px 18px 16px; display: none; border-color: var(--c, var(--accent)); }
  #effect.show { display: block; }
  #effect .t { font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1.1; }
  #effect .u { font-size: 14px; color: var(--dim); margin-top: 2px; }
  #effect .bar { height: 8px; background: rgba(255,255,255,.08); margin-top: 12px; overflow: hidden; }
  #effect .bar i { display: block; height: 100%; width: 100%; background: var(--c, var(--accent)); box-shadow: 0 0 12px var(--c, var(--accent)); transform-origin: left; }
  #effect .until { margin-top: 12px; font-size: 13px; color: var(--c, var(--accent)); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---- Chaos ---- */
  #chaos { position: absolute; top: 36px; left: 36px; width: 300px; padding: 12px 16px 14px; }
  #chaos .row { display: flex; justify-content: space-between; align-items: baseline; }
  #chaos .val { font-size: 22px; font-weight: 800; }
  #chaos .bar { height: 10px; margin-top: 8px; background: rgba(255,255,255,.08); }
  #chaos .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff2bd6); box-shadow: 0 0 14px #ff2bd6; transition: width .6s ease; }
  #chaos.hot .val { color: #ff2bd6; animation: pulse .7s infinite; }
  #paused { margin-top: 10px; color: #ff6b6b; font-size: 12px; display: none; }
  body.is-paused #paused { display: block; }

  /* ---- Queue ---- */
  #queue { position: absolute; right: 36px; top: 36px; width: 300px; display: none; padding: 12px 16px; }
  #queue.show { display: block; }
  #queue ul { list-style: none; margin: 8px 0 0; padding: 0; }
  #queue li { padding: 6px 0 6px 10px; border-left: 3px solid var(--c, var(--accent)); margin-top: 6px; font-size: 16px; font-weight: 700; text-transform: uppercase; }
  #queue li.bits { border-left-color: #F4B400; }
  #queue .bits-badge { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 4px; background: #F4B400; color: #1a1300; font-size: 11px; letter-spacing: .05em; vertical-align: 2px; }
  #queue li small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; text-transform: none; }

  /* ---- Season (Chaos-Score über mehrere Streams) ---- */
  #season { position: absolute; top: 150px; right: 36px; width: 300px; padding: 12px 16px 14px; display: none; }
  #season.show { display: block; }
  #season ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: r; }
  #season li { counter-increment: r; display: flex; justify-content: space-between; font-size: 15px; padding: 3px 0; }
  #season li::before { content: counter(r) "."; color: var(--accent); width: 22px; }
  #season li span:nth-child(1) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #season li span:nth-child(2) { color: var(--dim); }
  #season .left { margin-top: 8px; font-size: 12px; color: var(--dim); }

  /* ---- Hall / Contract ---- */
  #hall { position: absolute; right: 36px; bottom: 36px; width: 300px; padding: 12px 16px 14px; }
  #hall ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: r; }
  #hall li { counter-increment: r; display: flex; justify-content: space-between; font-size: 15px; padding: 3px 0; }
  #hall li::before { content: counter(r) "."; color: var(--accent); width: 22px; }
  #hall li span:nth-child(1) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hall li span:nth-child(2) { color: var(--dim); }
  #contract { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; }
  #contract .bar { height: 6px; background: rgba(255,255,255,.08); margin-top: 6px; }
  #contract .bar i { display: block; height: 100%; width: 0; background: #00f0ff; transition: width .6s ease; }
  #contract.done .bar i { background: #5cff9a; }

  /* ---- Verlauf: wer hat zuletzt was ausgelöst ---- */
  #history { position: absolute; top: 150px; left: 36px; width: 300px; padding: 12px 16px 12px; display: none; }
  #history.show { display: block; }
  #history ul { list-style: none; margin: 8px 0 0; padding: 0; }
  #history li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0 5px 10px; margin-top: 5px; border-left: 3px solid var(--c, var(--accent)); animation: slidein .5s ease; }
  #history li b { font-size: 16px; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #history li em { font-style: normal; font-size: 12px; color: var(--dim); align-self: center; }
  #history li small { grid-column: 1 / -1; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #history li:first-child small { color: var(--ink); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  body.no-history #history, body.no-top #hallBox { display: none !important; }
  body.only-stats > *:not(#stats):not(script) { display: none !important; }
  body.no-chaos #chaos { display: none; }
  /* Im Dashboard ausgeschaltete Fenster */
  body.off-chaos #chaos, body.off-queue #queue, body.off-history #history, body.off-hall #hall,
  body.off-effect #effect, body.off-season #season, body.off-stats #stats { display: none !important; }

  /* ---- Mitte: Rad / Route / Banner ---- */
  #center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); width: min(820px, 92vw); padding: 26px 30px; text-align: center; opacity: 0; pointer-events: none; transition: .3s; }
  #center.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #center .k { font-size: 14px; color: var(--accent); }
  #center .v { font-size: 64px; font-weight: 800; text-transform: uppercase; margin-top: 8px; line-height: 1.05; min-height: 70px; }
  #center .s { color: var(--dim); font-size: 16px; margin-top: 10px; }
  #center.land .v { color: #fff; text-shadow: 0 0 24px var(--accent), 0 0 4px #fff; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.85) } 60% { transform: scale(1.08) } 100% { transform: scale(1) } }
  #center.bad { border-color: #ff4d4d; box-shadow: 0 0 40px -4px #ff4d4d; }
  #center.bad .k, #center.bad .v { color: #ff6b6b; }

  /* ---- Overload ---- */
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background:
    repeating-linear-gradient(0deg, rgba(176,38,255,.28) 0 3px, transparent 3px 7px); mix-blend-mode: screen; }
  #flash.on { animation: flash 3.6s steps(1) 1; }
  @keyframes flash { 0%,10%,30%,50%,70% { opacity: .9 } 5%,20%,40%,60%,100% { opacity: 0 } }
  /* Reduzierte Blitz-Effekte (Fotosensibilität): einmaliges sanftes Einblenden statt Strobe */
  #flash.on-soft { animation: flash-soft 1.4s ease-out 1; }
  @keyframes flash-soft { 0% { opacity: 0 } 25% { opacity: .35 } 100% { opacity: 0 } }

  /* ---- Toast ---- */
  #toast { position: absolute; left: 50%; bottom: 36px; transform: translate(-50%, 200%); padding: 10px 20px; font-size: 15px; transition: transform .4s; max-width: 80vw; text-align: center; }
  #toast.show { transform: translate(-50%, 0); }
  #toast b { color: var(--accent); }

  /* ---- Session Stats: ruhige Glasfläche, große Zahlen, sanfte
     Übergänge, keine Blitze. Standardplatz links mittig unter dem CS2-Radar. Drei Designs:
     unknown (Schwarz/Neon-Lila/Cyan), dark (neutral dunkel), light (hell). ---- */
  #stats { position: absolute; left: 24px; top: 40%; width: max-content; min-width: 280px; max-width: 640px; display: none; border-radius: 16px; padding: 12px 14px 12px;
    --s-bg: rgba(14, 8, 26, .72); --s-line: rgba(176, 38, 255, .45); --s-ink: #f4eaff; --s-dim: #b9a3dc; --s-nat: #00f0ff; --s-cha: #ff2bd6; --s-glow: rgba(176, 38, 255, .35);
    background: var(--s-bg); border: 1px solid var(--s-line); color: var(--s-ink); box-shadow: 0 10px 30px -12px var(--s-glow), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); }
  #stats.show { display: block; }
  #stats.t-dark { --s-bg: rgba(16, 18, 24, .74); --s-line: rgba(255,255,255,.12); --s-ink: #f2f4f8; --s-dim: #9aa3b2; --s-nat: #60a5fa; --s-cha: #f472b6; --s-glow: rgba(0,0,0,.5); }
  #stats.t-light { --s-bg: rgba(255, 255, 255, .82); --s-line: rgba(20, 24, 36, .12); --s-ink: #151923; --s-dim: #5b6575; --s-nat: #2563eb; --s-cha: #db2777; --s-glow: rgba(20,24,36,.25); }
  #stats .s-bar { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(52px, auto)); gap: 6px 16px; }
  #stats .s-item { display: flex; flex-direction: column; min-width: 0; }
  #stats .s-item b { font-size: 30px; line-height: 1.05; font-weight: 750; font-variant-numeric: tabular-nums; transition: transform .35s ease, color .35s ease; }
  #stats .s-item b.bump { transform: scale(1.08); }
  #stats .s-item b.cha { color: var(--s-cha); }
  #stats .s-item span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--s-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats .s-split { margin-top: 10px; }
  #stats .s-split .track { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: rgba(127,127,127,.18); }
  #stats .s-split .track i { display: block; height: 100%; transition: width .7s ease; }
  #stats .s-split .lg { display: flex; justify-content: space-between; font-size: 11px; color: var(--s-dim); margin-top: 4px; }
  #stats .s-split .lg em { font-style: normal; color: var(--s-ink); font-weight: 650; }
  #stats .s-tort { margin-top: 8px; font-size: 12px; color: var(--s-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats .s-tort b { color: var(--s-cha); font-weight: 650; }
  #stats .s-pop { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .4s ease, opacity .4s ease, margin .4s ease; margin-top: 0;
    border-radius: 10px; background: color-mix(in srgb, var(--s-cha) 14%, transparent); border: 1px solid color-mix(in srgb, var(--s-cha) 40%, transparent); }
  #stats .s-pop.show { max-height: 80px; opacity: 1; margin-top: 10px; }
  #stats .s-pop.streak { background: color-mix(in srgb, var(--s-nat) 14%, transparent); border-color: color-mix(in srgb, var(--s-nat) 40%, transparent); }
  #stats .s-pop div { padding: 8px 10px; font-size: 14px; font-weight: 650; }
  #stats .s-pop small { display: block; font-weight: 400; font-size: 12px; color: var(--s-dim); margin-top: 2px; }
  body.no-stats #stats { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #stats *, #stats { transition: none !important; } }
  #conn { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; color: #ff6b6b; display: none; }
  #conn.show { display: block; }
  /* Testversion-Wasserzeichen - dezent, aber jederzeit lesbar, nicht übersehbar */
  #testVersion { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 11px; color: #ffd166; letter-spacing: .08em; text-transform: uppercase; display: none; text-shadow: 0 0 6px rgba(0,0,0,.6); }
  #testVersion.show { display: block; }
</style>
</head>
<body>
  <style id="customCss"></style>
  <div id="flash"></div>
  <div id="testVersion" class="mono" data-i18n="overlay.testVersion">Testversion — nicht für den Live-Einsatz bestimmt</div>

  <div id="chaos" class="panel">
    <div class="row"><img id="customLogo" alt="" style="display:none;height:18px;max-width:60px;object-fit:contain;margin-right:6px;vertical-align:middle"><span class="label mono" id="brand">CHAOSCORE</span><span class="val" id="chaosVal">0%</span></div>
    <div class="label mono" id="chaosLabel" data-i18n="overlay.chaosLevel">Chaos-Level</div>
    <div class="bar"><i id="chaosBar"></i></div>
    <div id="paused" class="mono" data-i18n="overlay.paused">ChaosCore pausiert</div>
  </div>

  <div id="queue" class="panel"><div class="label mono" data-i18n="overlay.queue">Warteschlange</div><ul id="queueList"></ul></div>

  <div id="history" class="panel">
    <div class="label mono" data-i18n="overlay.lastTriggered">Zuletzt ausgelöst</div>
    <ul id="historyList"></ul>
  </div>

  <div id="season" class="panel">
    <div class="label mono" id="seasonLabel">Season</div>
    <ol id="seasonList"></ol>
    <div class="left mono" id="seasonLeft"></div>
  </div>

  <div id="hall" class="panel">
    <div id="hallBox">
      <div class="label mono" id="hallLabel">Top Einlöser</div>
      <ol id="hallList"></ol>
    </div>
    <div id="contract"><div class="label mono" id="contractLabel">Daily Contract</div><div class="bar"><i id="contractBar"></i></div></div>
  </div>

  <div id="effect" class="panel">
    <div class="label mono" data-i18n="overlay.activeChallenge">Aktive Challenge</div>
    <div class="t" id="effT"></div>
    <div class="u" id="effU"></div>
    <div class="bar" id="effBarWrap"><i id="effBar"></i></div>
    <div class="until mono" id="effUntil" data-i18n="overlay.untilRoundEnd">Bis Rundenende</div>
  </div>

  <div id="stats" aria-live="polite">
    <div class="s-bar" id="sBar"></div>
    <div class="s-split" id="sSplit"><div class="track"><i id="sNat" style="background:var(--s-nat)"></i><i id="sCha" style="background:var(--s-cha)"></i></div>
      <div class="lg"><span id="sNatT"></span><span id="sChaT"></span></div></div>
    <div class="s-tort" id="sTort"></div>
    <div class="s-pop" id="sPop"><div id="sPopT"></div></div>
  </div>

  <div id="alert" class="panel">
    <div class="who mono" id="alWho"></div>
    <div class="what" id="alWhat"></div>
    <div class="flav" id="alFlav"></div>
  </div>

  <div id="center" class="panel"><div class="k mono" id="cenK"></div><div class="v" id="cenV"></div><div class="s" id="cenS"></div></div>
  <div id="toast" class="panel"></div>
  <div id="conn" class="mono" data-i18n="overlay.disconnected">Verbindung zu ChaosCore getrennt</div>

<script src="/i18n.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const tr = (key, fallback) => (window.__I18N__ || {})[key] ?? fallback;
  const root = document.documentElement;
  const qs = new URLSearchParams(location.search);
  if (qs.has('preview')) document.body.classList.add('preview');
  // Ein-/Ausblenden pro OBS-Quelle: ?history=0  ?top=0  ?chaos=0  ?stats=0
  for (const k of ['history', 'top', 'chaos', 'stats']) if (qs.get(k) === '0') document.body.classList.add('no-' + k);
  // ?only=stats: eigene OBS-Quelle nur mit den Session Stats (alles andere ausgeblendet).
  if (qs.get('only') === 'stats') document.body.classList.add('only-stats');
  let state = null, sound = true, effectTimer = null, alertTimer = null, centerTimer = null, toastTimer = null;

  // ---------- Panel-Layout (per Drag & Drop im Dashboard verschoben) ----------
  // Fehlt ein Panel in layout, bleibt es bei seiner festen CSS-Position (left/top/right/bottom).
  const LAYOUT_PANELS = ['chaos', 'queue', 'history', 'hall', 'effect', 'season', 'stats'];
  let styleSig = '';
  function applyStyles(styles) {
    const sig = JSON.stringify(styles);
    if (sig === styleSig) return;
    styleSig = sig;
    for (const id of ['chaos', 'queue', 'history', 'hall', 'effect', 'season']) {
      const el = $(id), st = styles[id];
      el.classList.remove('styled', 'st-dark', 'st-light', 'st-glass', 'st-round', 'st-noborder', 'st-noglow');
      for (const v of ['--accent', '--p-a', '--p-r']) el.style.removeProperty(v);
      if (!st) continue;
      el.classList.add('styled');
      if (st.theme !== 'unknown') el.classList.add('st-' + st.theme);
      if (st.shape === 'round') el.classList.add('st-round');
      if (!st.border) el.classList.add('st-noborder');
      if (!st.glow) el.classList.add('st-noglow');
      if (st.accent) el.style.setProperty('--accent', st.accent);
      el.style.setProperty('--p-a', String(st.opacity / 100));
      el.style.setProperty('--p-r', st.radius + 'px');
    }
  }
  let layoutSig = '';
  function applyLayout(layout) {
    const sig = JSON.stringify(layout || {});
    if (sig === layoutSig) return;
    layoutSig = sig;
    for (const id of LAYOUT_PANELS) {
      const el = $(id);
      const pos = layout && layout[id];
      if (pos) {
        el.style.left = pos.x + '%';
        el.style.top = pos.y + '%';
        el.style.right = 'auto';
        el.style.bottom = 'auto';
        // Größe, getrennt von der Position oben - ohne
        // eigenen scale-Wert bleibt ein Panel bei seiner normalen Größe (transform leer statt
        // "scale(1)", damit ein Panel ohne Größenwunsch exakt wie vorher aussieht).
        el.style.transformOrigin = 'top left';
        el.style.transform = pos.scale && pos.scale !== 1 ? `scale(${pos.scale})` : '';
      } else {
        el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.bottom = ''; el.style.transform = '';
      }
    }
  }

  // ---------- Ton ----------
  // ein eigener, hochgeladener Sound ersetzt - wenn vorhanden - JEDEN
  // der bisherigen synthetischen Pieptöne komplett (statt nur einen einzelnen Anlass), weil es
  // hier nur den einen Ton-Begriff "an/aus" gibt, keine Unterscheidung nach Anlass.
  let ctx = null;
  let customAudio = null;
  let customImageLoaded = false;
  function beep(seq) {
    if (!sound) return;
    if (customAudio) { try { customAudio.currentTime = 0; customAudio.play().catch(() => {}); } catch { /* Audio nicht verfügbar */ } return; }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      for (const [f, d, type = 'square', vol = 0.05] of seq) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d); t += d * 0.8;
      }
    } catch { /* Audio nicht verfügbar */ }
  }

  // ---------- Zustand ----------
  function render(s) {
    state = s; sound = s.sound;
    if (s.accent) root.style.setProperty('--accent', s.accent);
    $('brand').textContent = s.brand || 'CHAOSCORE';
    // eigener Sound/Logo nur einmal laden, nicht bei jedem Statuswechsel neu (das SSE
    // schickt den Status sehr häufig) - und sauber wieder abschalten, wenn er entfernt wurde.
    if (s.hasCustomSound && !customAudio) { customAudio = new Audio('/overlay-asset/sound?v=' + Date.now()); customAudio.volume = 0.6; }
    else if (!s.hasCustomSound && customAudio) { customAudio = null; }
    const logo = $('customLogo');
    if (s.hasCustomImage && !customImageLoaded) { logo.src = '/overlay-asset/image?v=' + Date.now(); logo.style.display = ''; customImageLoaded = true; }
    else if (!s.hasCustomImage && customImageLoaded) { logo.style.display = 'none'; logo.removeAttribute('src'); customImageLoaded = false; }
    $('chaosVal').textContent = s.chaos + '%';
    $('chaosBar').style.width = Math.min(100, s.chaos) + '%';
    // der Streamer kann das Community-Ziel frei umbenennen - fällt ohne
    // eigenen Namen auf den bisherigen Text zurück (data-i18n bleibt dafür im HTML unverändert).
    if (s.communityGoal?.name) $('chaosLabel').textContent = s.communityGoal.name;
    $('chaos').classList.toggle('hot', s.chaos >= 75);
    document.body.classList.toggle('is-paused', !!s.paused);
    // Testversion-Wasserzeichen (eine abgelaufene Testversion startet
    // server.js erst gar nicht - hier geht es nur um die Sichtbarkeit während der Laufzeit).
    $('testVersion').classList.toggle('show', !!s.license?.testVersion);

    const q = $('queueList'); q.textContent = '';
    for (const it of s.queue) {
      const li = document.createElement('li'); li.style.setProperty('--c', it.color); li.textContent = it.title;
      if (it.bits) { li.classList.add('bits'); const b = document.createElement('span'); b.className = 'bits-badge'; b.textContent = '◆ BITS'; li.prepend(b); }
      const sm = document.createElement('small'); sm.textContent = it.user; li.appendChild(sm); q.appendChild(li);
    }
    $('queue').classList.toggle('show', s.queue.length > 0);

    const ov = s.overlay || {};
    document.body.classList.toggle('no-history', ov.history === false);
    document.body.classList.toggle('no-top', ov.top === false);
    applyLayout(ov.layout);
    for (const id of LAYOUT_PANELS) document.body.classList.toggle('off-' + id, (ov.hidden || []).includes(id));
    applyStyles(ov.styles || {});
    if ($('customCss').textContent !== (ov.customCss || '')) $('customCss').textContent = ov.customCss || '';
    renderHall(s);
    renderHistory(s.history || [], ov.historyCount || 5);
    $('hall').style.display = '';
    const c = s.contract;
    $('contract').classList.toggle('done', c.done);
    $('contractLabel').textContent = c.done ? tr('overlay.contractDone', 'Daily Contract: erledigt') : tr('overlay.contractProgress', 'Daily Contract:') + ` ${Math.min(c.have, c.target)}/${c.target} ` + tr('overlay.viewers', 'Zuschauer');
    $('contractBar').style.width = Math.min(100, (c.have / Math.max(1, c.target)) * 100) + '%';

    renderEffect(s.current);
    renderSeason(s.season);
    renderStats(s.stats);
  }

  // ---------- Session Stats ----------
  const S_LABELS = {
    kills: ['overlay.stKills', 'Kills'], deaths: ['overlay.stDeaths', 'Tode'], kd: ['overlay.stKd', 'K/D'], fails: ['overlay.stFails', 'Fails'],
    deathsChaos: ['overlay.stDeathsChaos', 'Chaos-Tode'], deathsNatural: ['overlay.stDeathsNatural', 'Natürlich'], killsUnderChaos: ['overlay.stKillsUnderChaos', 'Kills im Chaos'],
    roundsWon: ['overlay.stRoundsWon', 'Runden W'], roundsLost: ['overlay.stRoundsLost', 'Runden L'], matchesWon: ['overlay.stMatchesWon', 'Siege'],
    matchesLost: ['overlay.stMatchesLost', 'Niederlagen'], bestStreak: ['overlay.stBestStreak', 'Beste Runde'],
  };
  let statsSig = '', statsVals = {}, popTimer = null;
  function renderStats(st) {
    const box = $('stats');
    const on = !!(st && st.enabled && st.active);
    box.classList.toggle('show', on);
    if (!on) { statsSig = ''; return; }
    for (const t of ['dark', 'light']) box.classList.toggle('t-' + t, st.overlayTheme === t);
    const ov = st.overlay || {};
    const t = st.totals || {};
    const sig = JSON.stringify([t, st.show, ov, st.torture]);
    if (sig === statsSig) return;
    statsSig = sig;
    const bar = $('sBar'); bar.style.display = ov.bar === false ? 'none' : '';
    const keys = (st.show || []).filter((k) => S_LABELS[k]);
    bar.style.setProperty('--n', Math.max(1, Math.min(keys.length, 6)));
    if (bar.children.length !== keys.length || [...bar.children].some((c, i) => c.dataset.k !== keys[i])) {
      bar.textContent = '';
      for (const k of keys) {
        const d = document.createElement('div'); d.className = 's-item'; d.dataset.k = k;
        const b = document.createElement('b'); if (k === 'deathsChaos' || k === 'killsUnderChaos') b.className = 'cha';
        const l = document.createElement('span'); l.textContent = tr(S_LABELS[k][0], S_LABELS[k][1]);
        d.append(b, l); bar.appendChild(d);
      }
    }
    for (const d of bar.children) {
      const k = d.dataset.k; const v = k === 'kd' ? Number(t.kd || 0).toFixed(2) : String(t[k] ?? 0);
      const b = d.querySelector('b');
      if (b.textContent !== v) {
        b.textContent = v;
        // sanftes "Antippen" statt Blinken; bei reduzierten Effekten gar keine Bewegung
        if (statsVals[k] !== undefined && !state?.overlay?.reduceFlash) { b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 350); }
        statsVals[k] = v;
      }
    }
    const nat = t.deathsNatural || 0, cha = t.deathsChaos || 0, sum = nat + cha;
    $('sSplit').style.display = ov.split === false ? 'none' : '';
    $('sNat').style.width = sum ? (nat / sum * 100) + '%' : '50%';
    $('sCha').style.width = sum ? (cha / sum * 100) + '%' : '50%';
    $('sSplit').style.opacity = sum ? '1' : '.5';
    const em = (n) => { const e = document.createElement('em'); e.textContent = n; return e; };
    $('sNatT').replaceChildren(tr('overlay.stNatural', 'Natürlich') + ' ', em(nat));
    $('sChaT').replaceChildren(tr('overlay.stByChaos', 'Durch Chaos') + ' ', em(cha));
    const top = (st.torture || [])[0];
    const tort = $('sTort');
    tort.style.display = ov.torture === false || !top ? 'none' : '';
    if (top) { const b = document.createElement('b'); b.textContent = top.name; tort.replaceChildren(tr('overlay.stTopTorturer', 'Top-Folterer') + ': ', b, ` · ${top.n}× 💀`); }
  }
  function statsPop(kind, title, sub) {
    const st = state?.stats;
    if (!st || !st.active || st.overlay?.popups === false || document.body.classList.contains('no-stats')) return;
    const p = $('sPop'); p.classList.toggle('streak', kind === 'streak');
    const tt = $('sPopT'); tt.textContent = title;
    if (sub) { const sm = document.createElement('small'); sm.textContent = sub; tt.appendChild(sm); }
    p.classList.add('show'); clearTimeout(popTimer); popTimer = setTimeout(() => p.classList.remove('show'), 4000);
  }

  // ---------- Season: Chaos-Score-Ranking über mehrere Streams ----------
  let seasonSig = '';
  function renderSeason(season) {
    if (!season) { $('season').classList.remove('show'); return; }
    const rows = season.chaosHall || [];
    $('season').classList.toggle('show', rows.length > 0);
    if (!rows.length) return;
    const daysLeft = Math.max(0, Math.ceil((season.endsAt - Date.now()) / 86400000));
    const sig = rows.map((r) => r.name + r.chaos).join('|') + '|' + daysLeft;
    if (sig === seasonSig) return;
    seasonSig = sig;
    $('seasonLabel').textContent = tr('overlay.seasonChaosScore', 'Season · Chaos-Score');
    const ol = $('seasonList'); ol.textContent = '';
    for (const r of rows) {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.textContent = r.name;
      const b = document.createElement('span'); b.textContent = r.chaos;
      li.append(a, b); ol.appendChild(li);
    }
    $('seasonLeft').textContent = daysLeft > 0
      ? tr('overlay.seasonDaysLeft', 'Noch {n} Tag(e)').replace('{n}', daysLeft)
      : tr('overlay.seasonEndingSoon', 'Endet bald');
  }

  // ---------- Top Einlöser: heute (dieser Stream) und gesamt, im Wechsel ----------
  let hallView = 'today', hallTimer = null, hallMode = '', hallSig = '';
  function drawHall() {
    const s = state; if (!s) return;
    const ov = s.overlay || {};
    const lists = { today: s.hallToday || [], all: s.hall || [] };
    const mode = ov.topMode || 'both';
    let view = mode === 'both' ? hallView : mode;
    if (!lists[view].length) view = lists[view === 'today' ? 'all' : 'today'].length ? (view === 'today' ? 'all' : 'today') : view;
    const rows = lists[view].slice(0, ov.topCount || 5);
    const sig = view + '|' + rows.map((r) => r.name + r.total).join('|');
    if (sig === hallSig) return;
    hallSig = sig;
    $('hallLabel').textContent = tr('overlay.topRedeemers', 'Top Einlöser') + ' · ' + (view === 'today' ? tr('overlay.today', 'Heute') : tr('overlay.allTime', 'Gesamt'));
    const h = $('hallList'); h.textContent = '';
    for (const r of rows) {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.textContent = r.name;
      const b = document.createElement('span'); b.textContent = r.total + '×';
      li.append(a, b); h.appendChild(li);
    }
  }
  function renderHall(s) {
    const ov = s.overlay || {};
    const key = (ov.topMode || 'both') + '|' + (ov.topRotateSec || 12);
    if (key !== hallMode) {
      hallMode = key; clearInterval(hallTimer); hallTimer = null;
      if ((ov.topMode || 'both') === 'both') hallTimer = setInterval(() => { hallView = hallView === 'today' ? 'all' : 'today'; drawHall(); }, (ov.topRotateSec || 12) * 1000);
    }
    drawHall();
  }

  // ---------- Verlauf ----------
  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return tr('overlay.justNow', 'gerade eben');
    const m = Math.round(s / 60);
    if (m < 60) return tr('overlay.minAgo', 'vor {n} Min').replace('{n}', m);
    return tr('overlay.hrsAgo', 'vor {n} Std').replace('{n}', Math.round(m / 60));
  }
  let historyKey = '';
  function renderHistory(list, max) {
    const items = list.slice(0, max);
    $('history').classList.toggle('show', items.length > 0);
    const key = items.map((i) => i.ts + i.user + i.title).join('|');
    if (key === historyKey) return; // nichts Neues: nicht neu zeichnen (spart Ressourcen, keine Animation)
    historyKey = key;
    const ul = $('historyList'); ul.textContent = '';
    for (const it of items) {
      const li = document.createElement('li'); li.style.setProperty('--c', it.color || 'var(--accent)'); li.dataset.ts = it.ts;
      const b = document.createElement('b'); b.textContent = it.user;
      const e = document.createElement('em'); e.textContent = ago(it.ts);
      const sm = document.createElement('small'); sm.textContent = it.title;
      li.append(b, e, sm); ul.appendChild(li);
    }
  }
  setInterval(() => { for (const li of document.querySelectorAll('#historyList li')) li.querySelector('em').textContent = ago(Number(li.dataset.ts)); }, 20000);

  function renderEffect(cur) {
    const box = $('effect');
    clearInterval(effectTimer);
    if (!cur) { box.classList.remove('show'); return; }
    box.classList.add('show');
    box.style.setProperty('--c', cur.color);
    $('effT').textContent = cur.title;
    $('effU').textContent = cur.test ? tr('overlay.testRun', 'Testlauf') : tr('overlay.byUser', 'von') + ' ' + cur.user;
    const wrap = $('effBarWrap'), until = $('effUntil'), bar = $('effBar');
    if (cur.endsAt) {
      wrap.style.display = ''; until.style.display = 'none';
      const total = Math.max(1, cur.endsAt - cur.startedAt);
      const tick = () => { const left = Math.max(0, cur.endsAt - Date.now()); bar.style.transform = `scaleX(${left / total})`; };
      tick(); effectTimer = setInterval(tick, 80);
    } else if (cur.untilStop) {
      wrap.style.display = 'none'; until.style.display = '';
    } else { wrap.style.display = 'none'; until.style.display = 'none'; }
  }

  // ---------- Effekte ----------
  function showAlert(f) {
    const a = $('alert');
    a.style.setProperty('--c', f.color || 'var(--accent)');
    $('alWho').textContent = (f.test ? tr('overlay.testPrefix', 'TEST') + ' · ' : '') + f.user;
    const w = $('alWhat'); w.textContent = f.title; w.dataset.t = f.title;
    $('alFlav').textContent = f.flavor || '';
    a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
    beep(f.sub ? [[330, .09], [520, .12]] : [[220, .08], [440, .08], [660, .16]]);
    clearTimeout(alertTimer); alertTimer = setTimeout(() => a.classList.remove('show'), f.sub ? 3800 : 4800);
  }

  function center(k, v, s = '', { ms = 4000, bad = false, land = false } = {}) {
    const c = $('center');
    $('cenK').textContent = k; $('cenV').textContent = v; $('cenS').textContent = s;
    c.classList.toggle('bad', bad); c.classList.toggle('land', land); c.classList.add('show');
    clearTimeout(centerTimer); centerTimer = setTimeout(() => c.classList.remove('show'), ms);
  }

  function wheel(f) {
    const total = f.ms || 5200, start = Date.now();
    center(tr('overlay.curseSpinning', 'UNKNOWN-Fluch · das Rad dreht'), '…', '', { ms: total + 2200 });
    (function spin() {
      const el = Date.now() - start;
      if (el >= total) {
        $('cenV').textContent = f.winner; $('cenK').textContent = tr('overlay.fateDecided', 'Das Schicksal hat entschieden');
        $('center').classList.add('land'); beep([[262, .1], [392, .1], [523, .2]]); return;
      }
      $('cenV').textContent = f.options[Math.floor(Math.random() * f.options.length)];
      beep([[200 + Math.random() * 200, .03, 'square', .02]]);
      setTimeout(spin, 60 + (el / total) * 380);
    })();
  }

  // "Chaos Overload" ist jetzt die eine, mitgelieferte Standard-Schwelle
  // eines frei benennbaren "Community-Ziels" - f.name/f.goalName kommen vom Server (siehe
  // engine.js: addGoalProgress) und ersetzen, wenn gesetzt, den bisher fest verdrahteten Text.
  function overload(f) {
    const fl = $('flash'); fl.classList.remove('on', 'on-soft'); void fl.offsetWidth;
    fl.classList.add(state?.overlay?.reduceFlash ? 'on-soft' : 'on');
    const title = (f?.name || 'CHAOS OVERLOAD').toUpperCase();
    center(tr('overlay.systemError', 'Systemfehler'), title, tr('overlay.unknownTakesControl', 'UNKNOWN übernimmt kurz die Kontrolle.'), { ms: 4200, bad: true });
    beep([[110, .25, 'sawtooth', .08], [90, .3, 'sawtooth', .08], [70, .45, 'sawtooth', .08]]);
  }

  function toast(html) {
    const t = $('toast'); t.textContent = '';
    for (const part of html) { if (typeof part === 'string') t.append(part); else { const b = document.createElement('b'); b.textContent = part.b; t.append(b); } }
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
  }

  function onFx(f) {
    switch (f.type) {
      case 'alert': showAlert(f); break;
      case 'wheel': wheel(f); break;
      case 'route': center(tr('overlay.routeChange', 'Routenwechsel'), f.pick, tr('overlay.ifSituationAllows', 'Wenn die Lage es zulässt.'), { ms: f.ms, land: true }); beep([[392, .1], [587, .15]]); break;
      case 'newleader':
        center(tr('overlay.newFirstPlace', 'Neuer Platz 1') + ' · ' + (f.scope === 'today' ? tr('overlay.today', 'Heute') : tr('overlay.allTime', 'Gesamt')), f.user, tr('overlay.overtakes', 'überholt') + ' ' + f.prev + ' · ' + f.count + '×', { ms: 5600, land: true });
        beep([[440, .08], [554, .08], [659, .08], [880, .22]]); break;
      case 'overload': overload(f); break;
      case 'contract': center(tr('overlay.contractComplete', 'Contract Complete'), tr('overlay.missionAccomplished', 'MISSION ERFÜLLT'), tr('overlay.communityDidIt', 'Die Community hat den Daily Contract geschafft.'), { ms: 4800, land: true }); beep([[523, .1], [659, .1], [784, .1], [1046, .25]]); break;
      case 'season_end':
        center(tr('overlay.seasonOver', 'Season beendet'), f.winner || tr('overlay.seasonNobody', 'Niemand hat teilgenommen'), f.winner ? tr('overlay.seasonWinnerChaos', '{n} Chaos-Score · neue Season gestartet').replace('{n}', f.chaos) : tr('overlay.seasonFreshStart', 'Neue Season gestartet.'), { ms: 5600, land: true });
        beep([[392, .1], [523, .1], [659, .1], [784, .25]]); break;
      case 'panic': center(tr('overlay.panicStop', 'Not-Aus'), tr('overlay.everythingStopped', 'ALLES GESTOPPT'), tr('overlay.chatControlPaused', 'ChaosCore wurde pausiert.'), { ms: 3500, bad: true }); beep([[160, .3, 'sawtooth', .08]]); break;
      case 'countdown': center(tr('overlay.testRun', 'Testlauf'), tr('overlay.startIn', 'Start in') + ' ' + f.seconds + ' s', tr('overlay.switchToGame', 'Wechsle jetzt ins Spiel.'), { ms: 4500 }); break;
      case 'stats_chaos_death': statsPop('death', tr('overlay.stPopDeath', '💀 {user} hat zugeschlagen').replace('{user}', f.user || '?'), f.title || ''); break;
      case 'stats_streak': statsPop('streak', tr('overlay.stPopStreak', '🔥 {n} Kills in dieser Runde').replace('{n}', f.streak), ''); break;
      case 'stats_fail': statsPop('fail', tr('overlay.stPopFail', '🤦 Fail!'), ''); break;
      case 'rejected': toast([{ b: f.user }, ' · ' + f.title + ' ' + tr('overlay.notExecuted', 'wurde nicht ausgeführt') + ' (' + f.reason + '). ' + tr('overlay.pointsRefunded', 'Punkte zurück.')]); break;
      default: break;
    }
  }

  // ---------- Verbindung ----------
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('conn').classList.remove('show');
    es.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'state') render(m.state); else if (m.type === 'fx') onFx(m.fx);
    };
    es.onerror = () => { $('conn').classList.add('show'); es.close(); setTimeout(connect, 2000); };
  }
  window.__ucc = { render, onFx }; // für Vorschau/Tests
  connect();
})();
</script>
</body>
</html>
